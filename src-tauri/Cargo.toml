[package]
name = "towermd-app"
version = "0.2.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "towermd_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
towermd-core = { path = "../crates/towermd-core" }
towermd-devkit = { path = "../crates/towermd-devkit" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
