[package]
name = "towermd-app"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "towermd_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[workspace]
