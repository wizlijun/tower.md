[workspace]
resolver = "2"
members = ["crates/towermd-core", "crates/towermd-devkit", "crates/towermd"]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
dirs = "5"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "process", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v7"] }
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tempfile = "3"
towermd-core = { path = "crates/towermd-core" }
towermd-devkit = { path = "crates/towermd-devkit" }
